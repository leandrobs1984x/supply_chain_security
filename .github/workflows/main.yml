
name: Generate SBOM Report with Syft

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL https://get.anchore.io/syft | sudo sh -s -- -b /usr/local/bin
          syft version

      - name: Generate SBOM
        run: |
          syft docker.io/kodekloud/webapp-color:latest \
            -o spdx-json=spdx.json

      - name: Validate SBOM
        run: |
          test -s spdx.json
          jq -e '.spdxVersion and .packages' spdx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spdx-sbom-report
          path: spdx.json
          if-no-files-found: error
